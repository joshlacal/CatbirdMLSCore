name: Build and Release FFI

# A final package tag must not rebuild native code from moving main branches.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New immutable versioned FFI release tag
        required: true
        type: string
      catbird_mls_ref:
        description: Full catbird-mls commit SHA
        required: true
        type: string
      catbird_atproto_ref:
        description: Full catbird-atproto commit SHA
        required: true
        type: string
      petrel_ref:
        description: Full Petrel commit SHA matching Package.swift
        required: true
        type: string
      petrel_catbird_ref:
        description: Full PetrelCatbird commit SHA matching Package.swift
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ffi-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ASSET_NAME: CatbirdMLSFFI.xcframework.zip
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  RUSTUP_TOOLCHAIN: "1.97.1"
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}
  CATBIRD_MLS_REF: ${{ github.event.inputs.catbird_mls_ref }}
  CATBIRD_ATPROTO_REF: ${{ github.event.inputs.catbird_atproto_ref }}
  PETREL_REF: ${{ github.event.inputs.petrel_ref }}
  PETREL_CATBIRD_REF: ${{ github.event.inputs.petrel_catbird_ref }}

jobs:
  build-xcframework:
    name: Build paired Swift and CatbirdMLSFFI.xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: CatbirdMLSCore
      - uses: actions/checkout@v4
        with:
          repository: joshlacal/catbird-mls
          ref: ${{ env.CATBIRD_MLS_REF }}
          path: catbird-mls
      - uses: actions/checkout@v4
        with:
          repository: joshlacal/catbird-atproto
          ref: ${{ env.CATBIRD_ATPROTO_REF }}
          path: catbird-atproto
      - uses: actions/checkout@v4
        with:
          repository: joshlacal/Petrel
          ref: ${{ env.PETREL_REF }}
          path: Petrel
      - uses: actions/checkout@v4
        with:
          repository: joshlacal/PetrelCatbird
          ref: ${{ env.PETREL_CATBIRD_REF }}
          path: PetrelCatbird

      - name: Check immutable sources and package dependency pins
        working-directory: CatbirdMLSCore
        run: |
          python3 -m unittest discover -s Scripts/tests -p test_ffi_release.py -v
          python3 Scripts/ffi-release.py preflight

      - name: Install pinned Rust toolchain and all seven targets
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
            aarch64-apple-ios-macabi x86_64-apple-ios-macabi \
            aarch64-apple-darwin x86_64-apple-darwin

      - name: Free disposable runner tool caches
        run: |
          df -h /
          selected="$(xcode-select -p | sed -E 's#(/Applications/[^/]+\.app).*#\1#')"
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$selected" ] || sudo rm -rf "$app"
          done
          sudo rm -rf /Users/runner/Library/Android /usr/local/lib/android /usr/local/share/dotnet || true
          df -h /

      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            catbird-mls/target
          key: ${{ runner.os }}-ffi-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('catbird-mls/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ffi-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Build without changing committed Swift bindings
        working-directory: CatbirdMLSCore
        env:
          FFI_VERIFY_COMMITTED_BINDINGS: "1"
        run: ./Scripts/rebuild-ffi.sh

      - name: Verify paired bindings and complete platform matrix
        working-directory: CatbirdMLSCore
        run: python3 Scripts/ffi-release.py verify

      - name: Verify Swift package against the new local binary
        working-directory: CatbirdMLSCore
        run: |
          swift test --package-path ../PetrelCatbird
          cp Package.swift release-support/Package.swift.committed
          trap 'cp release-support/Package.swift.committed Package.swift' EXIT
          python3 Scripts/ffi-release.py local-manifest
          swift build

      - name: Archive paired release and provenance
        working-directory: CatbirdMLSCore
        run: |
          ditto -c -k --keepParent Sources/CatbirdMLSFFI.xcframework "$ASSET_NAME"
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
          python3 Scripts/ffi-release.py provenance

      - name: Preserve outputs and provenance
        uses: actions/upload-artifact@v4
        with:
          name: catbird-mls-ffi
          path: |
            CatbirdMLSCore/${{ env.ASSET_NAME }}
            CatbirdMLSCore/${{ env.ASSET_NAME }}.sha256
            CatbirdMLSCore/release-support/
          if-no-files-found: error
